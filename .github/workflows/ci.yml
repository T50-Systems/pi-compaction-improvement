name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:github-config
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run check:file-size
      - run: pnpm audit --audit-level=high

  hosted-benchmark-baseline:
    name: Hosted benchmark (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    env:
      BENCHMARK_REPETITIONS: 5
      BENCHMARK_RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run benchmark:hosted --output benchmark-results/hosted
      - name: Upload numeric and sanitized benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-benchmark-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: |
            benchmark-results/hosted/hosted-benchmark-results.json
            benchmark-results/hosted/hosted-benchmark.log
          if-no-files-found: error
          retention-days: 14
